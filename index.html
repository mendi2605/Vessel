<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savefile | Твой темный архив поп-культуры</title>
    <style>
        /* Обнуление и базовые стили в стиле темного текстурного картона */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: #121213; /* Угольно-черный */
            background-image: radial-gradient(rgba(255,255,255,0.015) 1px, transparent 0);
            background-size: 24px 24px;
            color: #b5b0a3; /* Приглушенный текст */
            padding-bottom: 5rem;
        }

        /* Верхнее меню — Мрачно-оливковый */
        header {
            background-color: #272d1f; 
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #363f2b;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: bold;
            color: #e3ebd2;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(143, 164, 107, 0.3);
        }

        .logo span {
            color: #7d8f5c;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: #9ca68d;
            text-decoration: none;
            font-size: 1rem;
            text-transform: lowercase;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #e3ebd2;
        }

        /* Бейдж создателя в шапке */
        .creator-badge {
            background-color: #3b2f1d;
            border: 1px solid #b8860b;
            color: #ffd700;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Кнопка Телеграма в шапке */
        .tg-contact-btn {
            background-color: #1c2217;
            border: 1px solid #434f2e;
            color: #8fa46b;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .tg-contact-btn:hover {
            background-color: #3f4933;
            color: #d1dfb1;
            box-shadow: 0 0 10px rgba(143, 164, 107, 0.3);
        }

        /* Форма добавления нового контента */
        .add-content-section {
            max-width: 1000px;
            margin: 2rem auto;
            background-color: #1a1a1c;
            border: 2px dashed #3a3a3d;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .add-content-section h2 {
            font-size: 1.3rem;
            font-weight: normal;
            margin-bottom: 1rem;
            color: #8fa46b;
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            color: #858074;
        }

        .form-group input, .form-group select {
            padding: 0.5rem;
            border: 1px solid #3a3a3c;
            border-radius: 4px;
            background-color: #222225;
            font-family: inherit;
            color: #d5cfc0;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #617043;
        }

        .form-submit-btn {
            background-color: #3f4933;
            color: #d1dfb1;
            border: none;
            padding: 0.6rem;
            font-family: inherit;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 3px 0 #22291c;
            transition: all 0.1s;
        }

        .form-submit-btn:hover {
            background-color: #4e5b3f;
            transform: translateY(1px);
            box-shadow: 0 2px 0 #22291c;
        }

        /* Главный приветственный блок */
        .hero-section {
            max-width: 1000px;
            margin: 2rem auto;
            background-color: #272d20; 
            border-radius: 50px 30px 40px 40px; 
            padding: 2.5rem;
            color: #c5c0b4;
            display: flex;
            align-items: stretch;
            gap: 2rem;
            border: 1px solid #333c2a;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.5);
            flex-wrap: wrap;
        }

        .hero-info {
            flex: 2;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-info h1 {
            font-size: 2.3rem;
            font-weight: normal;
            margin-bottom: 1rem;
            color: #d1dfb1;
        }

        .hero-info p {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #929c81;
            margin-bottom: 1.5rem;
        }

        .hero-tg-btn {
            align-self: flex-start;
            background-color: #3f4933;
            color: #d1dfb1;
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.95rem;
            box-shadow: 0 4px 0 #22291c;
            transition: all 0.2s;
        }

        .hero-tg-btn:hover {
            background-color: #4e5b3f;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #22291c;
        }

        /* Правая колонка профиля и друзей */
        .hero-right-side {
            flex: 1.2;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Виджет профиля создателя */
        .creator-profile-card {
            background-color: #161618;
            border: 1px solid #363f2b;
            border-radius: 12px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .creator-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #3f4933, #7d8f5c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
            border: 2px solid #8fa46b;
            flex-shrink: 0;
        }

        .creator-details {
            flex-grow: 1;
        }

        .creator-name {
            font-size: 1.1rem;
            color: #e6e1d6;
        }

        .creator-title {
            font-size: 0.75rem;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ПАНЕЛЬ ДРУЗЕЙ */
        .friends-panel {
            background-color: #161618;
            border: 1px solid #2d2d30;
            border-radius: 12px;
            padding: 1rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .friends-panel h3 {
            font-size: 0.95rem;
            color: #8fa46b;
            text-transform: lowercase;
            border-bottom: 1px solid #252528;
            padding-bottom: 0.3rem;
        }

        .friends-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 120px;
            overflow-y: auto;
        }

        .friend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1c1c1e;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            border: 1px solid #252528;
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .friend-avatar {
            width: 24px;
            height: 24px;
            background-color: #423d33;
            color: #cbc5b8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .friend-name {
            font-size: 0.9rem;
            color: #cbc5b8;
        }

        .remove-friend-btn {
            background: none;
            border: none;
            color: #696356;
            cursor: pointer;
            font-size: 1rem;
        }

        .remove-friend-btn:hover {
            color: #ff5555;
        }

        .no-friends-text {
            font-size: 0.85rem;
            color: #696356;
            font-style: italic;
            text-align: center;
            padding: 0.5rem 0;
        }

        /* Форма ввода друга */
        .add-friend-form {
            display: flex;
            gap: 0.5rem;
        }

        .friend-input {
            flex-grow: 1;
            background-color: #1c1c1e;
            border: 1px solid #2d2d30;
            border-radius: 4px;
            padding: 0.4rem 0.6rem;
            color: #fff;
